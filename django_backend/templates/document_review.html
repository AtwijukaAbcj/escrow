{% extends 'base.html' %}
{% block title %}Review document | TrustPay Africa{% endblock %}
{% block content %}
<div class="tp-card tp-section">
    <h1 style="margin-top:0;">Review document</h1>
    <p><strong>{{ document.name }}</strong> · {{ document.transaction.id }} · v{{ document.version }}</p>
    {% if document.file %}<p><a class="tp-btn tp-btn--secondary" href="{{ document.file.url }}" target="_blank" rel="noopener">View file</a></p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="tp-field"><label for="comment">Review notes</label><textarea id="comment" name="comment" rows="4" style="width:100%; box-sizing:border-box; padding:12px;"></textarea></div>
        <div style="display:flex; gap:12px; margin-top:16px;"><button class="tp-btn" name="decision" value="verified" type="submit">Verify</button><button class="tp-btn tp-btn--secondary" name="decision" value="rejected" type="submit">Reject</button></div>
    </form>
</div>
{% endblock %}
